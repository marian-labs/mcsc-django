services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcsc_web_app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    command: gunicorn --bind 0.0.0.0:${PORT:-8000} --workers 2 --timeout 120 mcsc.wsgi:application
    volumes:
      - ./media:/app/media
      - static_data:/app/staticfiles
    networks:
      - infra_default
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${PORT:-8000}/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  static_data:
    driver: local

networks:
  infra_default:
    external: true
    name: infra_default
